# Elsewhere on a VPS.
#
#   cp .env.example .env    # fill it in
#
# Server that ALREADY runs nginx/Apache/Traefik on ports 80/443 (the usual case):
#   docker compose up -d --build
#   → the app listens on 127.0.0.1:${WEB_PORT:-3010}; point your proxy at it
#     (see deploy/nginx.conf.example).
#
# Fresh server with nothing on 80/443 — let the bundled Caddy do HTTPS:
#   docker compose --profile caddy up -d --build
#
# NEXT_PUBLIC_* are baked in at build time, so after changing any of them rebuild (--build).

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_AUTH_GOOGLE: ${NEXT_PUBLIC_AUTH_GOOGLE:-false}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
    image: elsewhere-web:latest
    restart: unless-stopped
    environment:
      # Server-side code reads these at runtime too (same values as the build).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    volumes:
      # Keeps the ISR/image cache across restarts and redeploys.
      - next-cache:/app/.next/cache
    ports:
      # Loopback only: reachable by a reverse proxy on this server, never from the internet.
      - "127.0.0.1:${WEB_PORT:-3010}:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  next-cache:
  caddy-data:
  caddy-config:
