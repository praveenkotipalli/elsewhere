<!doctype html>
<html>
  <body style="margin:0;padding:48px 24px;background:#ECE9E3;color:#0E0E0D;font-family:Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;padding-bottom:48px;">Elsewhere</td>
      </tr>
      <tr>
        <td style="font-size:14px;line-height:1.6;padding-bottom:16px;color:#55534F;">Your code</td>
      </tr>
      <tr>
        <td style="font-size:44px;letter-spacing:0.28em;font-weight:500;padding-bottom:40px;">{{ .Token }}</td>
      </tr>
      <tr>
        <td style="font-size:14px;line-height:1.6;padding-bottom:32px;">
          Type it where you left off. It works for an hour.<br />
          Or <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="color:#0E0E0D;">open this link</a> on the same device.
        </td>
      </tr>
      <tr>
        <td style="font-size:12px;line-height:1.6;color:#8C8983;">Didn't ask for this? Ignore it. Nothing happens.</td>
      </tr>
    </table>
  </body>
</html>
